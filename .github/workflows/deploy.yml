# Este archivo inicia la página ("npm run dev") en github actions para tenerla para el publico
#
# Publica dos versiones en el mismo sitio:
# - la de computador en la raíz (index.html, styles.css, script.js, js/, assets/ y Three.js y GSAP), igual que antes;
# - la de realidad mixta para Meta Quest 3 (carpeta xr/, Vite + IWSDK) en la subcarpeta /xr/:
#   https://marianabarragan.github.io/elpasodeltiempo/xr/

# Requisito único en GitHub: Settings → Pages → Build and deployment → Source: «GitHub Actions».
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; no cancela uno que ya esté publicando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          # Dos proyectos con su propio package-lock.json: la página de computador y la app de realidad mixta.
          cache-dependency-path: |
            package-lock.json
            xr/package-lock.json

      - name: Instalar dependencias (versiones fijadas en package-lock.json)
        run: npm ci

      - name: Comprobar la sintaxis de los módulos
        run: npm run check

      - name: Instalar dependencias de la versión de realidad mixta (xr/package-lock.json)
        working-directory: xr
        run: npm ci

      - name: Compilar la versión de realidad mixta
        working-directory: xr
        run: npm run build

      - name: Reunir los archivos del sitio
        run: |
          mkdir -p _site/node_modules/three/build _site/node_modules/gsap/dist
          cp index.html styles.css script.js _site/
          cp -r js assets _site/
          # Mismas rutas que usa index.html: node_modules/three/build/three.min.js y node_modules/gsap/dist/gsap.min.js
          cp node_modules/three/build/three.min.js _site/node_modules/three/build/
          cp node_modules/gsap/dist/gsap.min.js _site/node_modules/gsap/dist/
          # Versión de realidad mixta, compilada en xr/dist, en la subcarpeta /xr/ (rutas relativas: base './').
          cp -r xr/dist _site/xr
          # Sin procesamiento Jekyll: los archivos se sirven tal cual (incluidos los de xr/ que empiezan con «_»).
          touch _site/.nojekyll
          # Verifica que existe cada script, hoja de estilos e ícono local que pide cada index.html.
          # Se lee una ruta por línea: algunos nombres tienen espacios («boton volumen.svg»).
          missing=0
          while IFS= read -r ref; do
            if [ ! -f "_site/$ref" ]; then echo "Falta en el sitio: $ref"; missing=1; fi
          done < <(grep -oE '(src|href)="[^"#:]+"' index.html | sed -E 's/^(src|href)="//; s/"$//')
          while IFS= read -r ref; do
            if [ ! -f "_site/xr/$ref" ]; then echo "Falta en la versión de realidad mixta: $ref"; missing=1; fi
          done < <(grep -oE '(src|href)="[^"#:]+"' _site/xr/index.html | sed -E 's/^(src|href)="//; s/"$//')
          # La app de realidad mixta carga estos recursos originales (lista en xr/src/recursos.js).
          for ref in models/adulthood/mesa/mesa.glb models/childhood/toys.glb models/oldage/radio/radio.glb audio/ambiental.mp3; do
            if [ ! -f "_site/xr/assets/$ref" ]; then echo "Falta en la versión de realidad mixta: assets/$ref"; missing=1; fi
          done
          exit $missing

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
